<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} — {% if page.identity == 'layon' %}Láyon{% else %}Lion De Leon{% endif %}</title>
<link rel="stylesheet" href="/style.css">
<script defer src="/nav.js"></script>
</head>
<body{% if page.identity == 'layon' %} class="layon"{% endif %}>

<header id="header-container"></header>

<hr>

<article>
  <h2>{{ page.title }}</h2>
  <p class="writing-meta">{{ page.date | date: "%B %-d, %Y" }}{%- if page.tags.size > 0 %} — {%- for tag in page.tags %} <span class="tag">{{ tag }}</span>{%- endfor %}{%- endif %}</p>
  {{ content }}
</article>

<p><a href="{% if page.identity == 'layon' %}/layon/writings.html{% else %}/writings.html{% endif %}">← Back to Writings</a></p>

</body>
</html>
